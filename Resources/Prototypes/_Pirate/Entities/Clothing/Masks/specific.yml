- type: entity
  abstract: true
  parent: Clothing
  id: ClothingBalaclavaBase
  components:
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: true
    slots:
    - mask
  - type: Sprite
    state: icon
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 2
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100
  - type: Food
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Fiber
          Quantity: 10
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide
    - FacialHair
  - type: Tag
    tags:
    - Mask
    - ClothMade



